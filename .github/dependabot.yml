# Managed dependency updates. Weekly; minor/patch grouped to limit PR noise.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # keyring 4 er en omskriving (keyring-core + egne lagringscrates; featurene
      # apple-native/windows-native finnes ikke lenger) og ble tilbakestilt til 3.
      # Tas med vilje i egen runde, med bevis på ekte Mac og Windows for at
      # lagrede innlogginger overlever — se PR-en som innførte denne regelen.
      - dependency-name: "keyring"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain: toolchainen er bevisst pinnet likt i hele suiten
      # (universal-bygg-fella), og action-repoet har forhåndslagde grener for
      # Rust-versjoner som ikke finnes ennå (1.120.0 → 404 i rustup).
      # Bumpes for hånd. Samme regel som sundayrec#196.
      - dependency-name: "dtolnay/rust-toolchain"
