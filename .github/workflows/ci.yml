# CI — gates every push/PR on the same checks run locally:
# TypeScript packages (pnpm -r build/typecheck/test) + Rust crates (cargo test).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinnet likt med appene som bruker cratene (aldri rust-toolchain.toml —
      # dtolnay leser den ikke, og appenes universal-bygg brekker).
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
