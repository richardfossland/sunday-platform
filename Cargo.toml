# Cargo workspace for the Sunday platform's shared Rust crates.
#
# Consumed by the Tauri desktop apps (SundayRec, SundayStage, SundayEdit,
# SundayStudio, SundayPaper) as git dependencies pinned to a tag — there is no
# crates.io publish step (and no shared CI yet; the GitHub Actions quota is the
# constraint). Each app adds, e.g.:
#
#   sunday-contracts = { git = "https://github.com/richardfossland/sunday-platform", tag = "v0.1.0" }
[workspace]
resolver = "2"
members = [
    "crates/sunday-contracts",
    "crates/sunday-auth",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
authors = ["Richard Fossland"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.2"
# keyring holdes på 3 med vilje. 4 er en omskriving (keyring-core + egne
# lagringscrates; featurene apple-native/windows-native finnes ikke lenger).
# Appene (rec/stage/edit) bruker keyring 3 med de featurene, og sunday-auth
# arver dem via feature-unifisering bare så lenge begge står på SAMME major.
# Med 4 her ville sunday-auth fått en annen lagring enn appen selv — utestet på
# Mac/Windows, med risiko for at lagrede innlogginger forsvinner. Tas i egen
# runde med bevis på ekte maskiner (Dependabot-major er ignorert til da).
keyring = "3"
base64 = "0.22"
